[workspace]
resolver = "2"
members = [
    "crates/muninn-core",
    "crates/muninn-cli",
    # "crates/muninn-gui",  # TODO: uncomment when GUI work begins
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Proprietary"
repository = "https://github.com/cakeintelligence/muninn"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

# Filesystem
walkdir = "2"
filetime = "0.2"
mime_guess = "2"
infer = "0.16"
globset = "0.4"

# PDF
lopdf = "0.32"
pdf-extract = "0.7"

# Office (OOXML + OLE)
zip = "2"
quick-xml = "0.36"
cfb = "0.10"

# Text & Encoding
chardetng = "0.1"
encoding_rs = "0.8"

# Language Detection
whichlang = "0.1"

# Regex & Text Analysis
regex = "1"
aho-corasick = "1"

# Image Metadata
kamadak-exif = "0.5"
imagesize = "0.13"

# Email
mailparse = "0.15"

# System
hostname = "0.4"

# Concurrency
rayon = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Testing
tempfile = "3"
assert_cmd = "2"
predicates = "3"
proptest = "1"
insta = "1"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
